{{- if .Values.secretProvider.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-api-secrets
  labels:
    app: backend-api
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.azureClientId | quote }}
    keyvaultName: {{ .Values.secretProvider.keyvaultName | quote }}
    tenantId: {{ .Values.secretProvider.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: demo-password
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
{{- end }}
