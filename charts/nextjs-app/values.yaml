replicaCount: 2

image:
  repository: abhiacr07.azurecr.io/nextjs-app
  tag: "80ac310628f2dc76f207a77bfd09f9a584e1a237"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: nextjs-app

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# No ingress controller in the cluster yet — turn this on once
# Stage 2 installs ingress-nginx.
ingress:
  enabled: false
  className: nginx
  host: nextjs-demo.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

probes:
  path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 10

# APIM's internal gateway hostname — see pages/api/login.js and
# pages/api/me.js, the only two places this app calls out to the backend.
# Leave blank until APIM is actually provisioned; those routes fail with a
# clear "not configured" error rather than a confusing crash if it's unset.
apim:
  gatewayUrl: ""

# No Key Vault / workload identity in this simplified infra —
# leave disabled until that's actually built.
secretProvider:
  enabled: false