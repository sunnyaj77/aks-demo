[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# The URL is supplied at runtime by env.py using either:
#  - Microsoft Entra authentication via PGACCESS_TOKEN (GitHub Actions)
#  - Password authentication via DATABASE_URL (local development)
# This placeholder is overridden in env.py and should not contain real credentials.
sqlalchemy.url = postgresql+psycopg2://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
