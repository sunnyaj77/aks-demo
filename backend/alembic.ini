[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# The URL is supplied at runtime by DATABASE_URL or DATABASE_URL_PATH.
# env.py replaces this placeholder before connecting, so no credentials are
# committed to the repository.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost/database

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
