name: Migrate PostgreSQL schema

on:
  workflow_call:
    inputs:
      environment_name:
        required: false
        type: string
        default: production
        description: GitHub environment to deploy to
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"
  ARM_ACCESS_KEY:      ${{ secrets.TFSTATE_ACCESS_KEY }}

jobs:
  migrate-database:
    name: Alembic migration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with UAMI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get PostgreSQL Entra access token
        id: fetch-token
        shell: bash
        run: |
          set -euo pipefail

          token="$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken --output tsv)"

          if [[ -z "$token" ]]; then
            echo "az account get-access-token returned an empty token." >&2
            echo "Check that the workflow identity has access to the oss-rdbms resource type." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "pgaccess_token=$token" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Show migration info
        run: |
          echo "PostgreSQL Server: ${{ vars.PGHOST }}"
          echo "Database: ${{ vars.PGDATABASE }}"
          echo "User: ${{ vars.PGUSER }}"
          echo "Port: ${{ vars.PGPORT }}"

      - name: Resolve PostgreSQL variables
        shell: bash
        env:
          PGHOST_PRIMARY: ${{ vars.PGHOST }}
          PGHOST_FALLBACK: ${{ vars.POSTGRES_FQDN }}
          PGDATABASE_VALUE: ${{ vars.PGDATABASE }}
          PGUSER_PRIMARY: ${{ vars.PGUSER }}
          PGUSER_FALLBACK_1: ${{ vars.PGADMIN }}
          PGUSER_FALLBACK_2: ${{ vars.POSTGRES_ADMIN_USERNAME }}
          PGPORT_VALUE: ${{ vars.PGPORT }}
        run: |
          resolved_pghost="${PGHOST_PRIMARY:-$PGHOST_FALLBACK}"
          resolved_pguser="${PGUSER_PRIMARY:-${PGUSER_FALLBACK_1:-$PGUSER_FALLBACK_2}}"
          resolved_pgdatabase="$PGDATABASE_VALUE"
          resolved_pgport="${PGPORT_VALUE:-5432}"

          if [[ -z "$resolved_pghost" || -z "$resolved_pguser" || -z "$resolved_pgdatabase" ]]; then
            echo "Failed to resolve required PostgreSQL variables."
            [[ -z "$resolved_pghost" ]] && echo "Missing PGHOST/POSTGRES_FQDN variable."
            [[ -z "$resolved_pguser" ]] && echo "Missing PGUSER/PGADMIN/POSTGRES_ADMIN_USERNAME variable."
            [[ -z "$resolved_pgdatabase" ]] && echo "Missing PGDATABASE variable."
            exit 1
          fi

          echo "PGHOST=$resolved_pghost" >> "$GITHUB_ENV"
          echo "PGUSER=$resolved_pguser" >> "$GITHUB_ENV"
          echo "PGDATABASE=$resolved_pgdatabase" >> "$GITHUB_ENV"
          echo "PGPORT=$resolved_pgport" >> "$GITHUB_ENV"
          echo "Resolved PostgreSQL variables."

      - name: Run Alembic migrations
        working-directory: backend
        env:
          PGACCESS_TOKEN: ${{ env.pgaccess_token }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          retries=10
          sleep_seconds=6

          for ((attempt = 1; attempt <= retries; attempt++)); do
            echo "Checking migration connectivity (attempt $attempt/$retries)..."
            if python -c "from db import check_database_connectivity; check_database_connectivity()"
            then
              break
            fi

            if [[ "$attempt" -eq "$retries" ]]; then
              echo "Unable to connect to PostgreSQL after $retries attempts."
              exit 1
            fi

            sleep "$sleep_seconds"
          done

          echo "Checking current migration status..."
          alembic current || echo "No migrations applied yet"

          echo "Applying pending migrations..."
          alembic upgrade head

          echo "Current migration status:"
          alembic current

      - name: Migration success
        if: success()
        run: |
          echo "✅ Database migration completed successfully"
          echo "All pending schema changes have been applied to PostgreSQL."

      - name: Migration failure
        if: failure()
        run: |
          echo "❌ Database migration failed"
          echo "Review logs above for error details."
          exit 1
