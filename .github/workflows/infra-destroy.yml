name: infra-destroy
on:
  workflow_dispatch:
    inputs:
      confirm_cluster_name:
        description: 'Type the exact AKS cluster name to confirm destruction'
        required: true

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"
  ARM_ACCESS_KEY:      ${{ secrets.TFSTATE_ACCESS_KEY }}
  # `terraform destroy` still has to evaluate the full configuration to
  # build its plan (it needs to know what *would* exist to know what to
  # tear down) — so it needs every variable that has no default, exactly
  # like infra-apply.yml, or it fails before it ever touches Azure.
  TF_VAR_apim_publisher_name:   ${{ secrets.APIM_PUBLISHER_NAME }}
  TF_VAR_apim_publisher_email:  ${{ secrets.APIM_PUBLISHER_EMAIL }}
  TF_VAR_runner_ssh_public_key: ${{ secrets.RUNNER_SSH_PUBLIC_KEY }}
  TF_VAR_github_runner_pat:     ${{ secrets.RUNNER_REGISTRATION_PAT }}

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    # Destroying the private data layer isn't instant — Postgres/Redis/APIM
    # teardown routinely takes 15-20+ minutes combined, APIM being the
    # slowest (it was also the slowest to create). GitHub's own default
    # (360 min) would cover this fine, but pinning a smaller explicit
    # number means a hung run fails loudly well before using up 6 hours of
    # Actions minutes.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Guard — stop unless the typed name matches
        run: |
          if [ "${{ github.event.inputs.confirm_cluster_name }}" != "aks-nextjs-demo" ]; then
            echo "Typed name did not match 'aks-nextjs-demo' — aborting."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -destroy -out=tfplan
      - run: terraform apply tfplan
