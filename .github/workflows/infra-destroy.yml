name: infra-destroy
on:
  workflow_dispatch:
    inputs:
      confirm_cluster_name:
        description: 'Type the exact AKS cluster name to confirm destruction'
        required: true

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"
  ARM_ACCESS_KEY:      ${{ secrets.TFSTATE_ACCESS_KEY }}

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      
      - name: Guard — stop unless the typed name matches
        run: |
          if [ "${{ github.event.inputs.confirm_cluster_name }}" != "aks-nextjs-demo" ]; then
            echo "Typed name did not match 'aks-nextjs-demo' — aborting."
            exit 1
          fi

      
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform destroy -auto-approve
