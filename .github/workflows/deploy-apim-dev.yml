name: Deploy APIM Dev

on:
  push:
    branches:
      - main
    paths:
      - "apim/dev/**"
      - ".github/workflows/deploy-apim-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Import API and apply policies
    runs-on: ubuntu-latest
    environment: dev
    env:
      APIM_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      APIM_API_ID: backend-api
      APIM_API_PATH: backend-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate configuration and the Dev team's OpenAPI document before
      # logging in. Replace the sample document before running this workflow.
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$APIM_RESOURCE_GROUP" ]]; then
            echo "::error::Set the AZURE_RESOURCE_GROUP variable in the GitHub dev environment."
            exit 1
          fi
          if [[ -z "$APIM_SERVICE_NAME" ]]; then
            echo "::error::Set the APIM_SERVICE_NAME variable in the GitHub dev environment."
            exit 1
          fi
          if [[ ! -s apim/dev/openai.yaml ]]; then
            echo "::error::Required API definition apim/dev/openai.yaml is missing or empty."
            exit 1
          fi
          if grep -Fq "replace-with-backend-host" apim/dev/openai.yaml; then
            echo "::error::Replace the sample server URL in apim/dev/openai.yaml with the Dev backend URL."
            exit 1
          fi

          for section in inbound backend outbound; do
            if [[ ! -s "apim/dev/policies/backend-api/${section}.xml" ]]; then
              echo "::warning::Policy section ${section}.xml is missing; APIM will inherit its parent policy for this section."
            fi
          done

      # Uses the repository's Azure OIDC identity. The APIM service itself
      # must already exist, and this identity must be allowed to manage it.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import or update API from openai.yaml
        run: |
          az apim api import \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --service-name "$APIM_SERVICE_NAME" \
            --api-id "$APIM_API_ID" \
            --path "$APIM_API_PATH" \
            --specification-format OpenApi \
            --specification-path apim/dev/openai.yaml

      # APIM accepts one complete policy document per API. Assemble the
      # separately maintained XML sections so applying one does not replace
      # the others; absent optional files inherit the parent policy.
      - name: Apply available API policy sections
        shell: bash
        run: |
          set -euo pipefail

          policy_file="$RUNNER_TEMP/backend-api-policy.xml"
          {
            echo '<policies>'
            for section in inbound backend outbound; do
              section_file="apim/dev/policies/backend-api/${section}.xml"
              if [[ -s "$section_file" ]]; then
                cat "$section_file"
              else
                printf '<%s><base /></%s>\n' "$section" "$section"
              fi
            done
            echo '<on-error><base /></on-error>'
            echo '</policies>'
          } > "$policy_file"

          az apim api policy create \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --service-name "$APIM_SERVICE_NAME" \
            --api-id "$APIM_API_ID" \
            --xml-content "$(cat "$policy_file")"
