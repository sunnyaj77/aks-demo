# This is the Flux "pointer" mentioned in your repo diagram.
# It doesn't contain any pod/container logic itself — it just tells
# FluxCD: "watch charts/nextjs-app in this same repo, and keep the
# cluster's live state matching whatever's on the target branch."
#
# It assumes `flux bootstrap` has already created a GitRepository
# named "flux-system" in the "flux-system" namespace that points at
# THIS repo (bootstrap does this for you automatically — see the
# command below). This file just references that existing source
# by name; it does not create it.

# Explicit Namespace object, applied by kustomize-controller BEFORE the
# HelmRelease below. This is required: the HelmRelease's own
# metadata.namespace (nextjs-app) has to exist for kustomize-controller
# to apply that object at all — install.createNamespace further down
# only creates the namespace for the eventual Helm install, which never
# gets reached if the HelmRelease itself can't be applied first.
apiVersion: v1
kind: Namespace
metadata:
  name: nextjs-app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextjs-app
  namespace: nextjs-app
spec:
  # How often Flux re-checks this HelmRelease against the chart source
  # and reconciles drift (e.g. someone manually kubectl-edited a Deployment).
  interval: 5m

  chart:
    spec:
      # In-repo chart path, NOT a Helm repository chart name+version.
      # Because this points at a path rather than a published chart,
      # Flux re-renders it whenever the GitRepository source updates —
      # i.e. whenever you push a commit that touches charts/nextjs-app/.
      chart: ./charts/nextjs-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      # How often Flux checks the chart source itself for changes.
      interval: 5m
      # IMPORTANT: default is "ChartVersion", which only rebuilds the
      # chart when Chart.yaml's `version` field changes — NOT simply
      # whenever file contents change. That's exactly what bit us
      # yesterday: values.yaml changed, Chart.yaml's version didn't,
      # so Flux kept serving a stale cached chart build. "Revision"
      # instead rebuilds on every new git commit touching this path —
      # correct behavior for a chart under active development, and it
      # means ci-cd.yaml doesn't need to remember to bump Chart.yaml
      # every time it bumps the image tag.
      reconcileStrategy: Revision

  install:
    # Creates the "nextjs-app" namespace on first install if it doesn't
    # exist yet — you destroyed the cluster via terraform destroy, so
    # this matters: there's nothing pre-provisioned to deploy into.
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  # Left empty on purpose: this inherits every default straight from
  # charts/nextjs-app/values.yaml (autoscaling on, ingress off, etc.
  # — everything we already walked through). Override only what needs
  # to differ for this specific environment (dev). Example, once
  # Pipeline B exists and needs to pin a real image tag:
  #
  # values:
  #   image:
  #     tag: "<git-sha>"
  values: {}